name: Bug report
description: Something in the package does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: laravel
    attributes:
      label: Laravel and PHP versions
      placeholder: Laravel 13, PHP 8.4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the smallest code that shows it. Never paste your API key or webhook secret.
    validations:
      required: true
